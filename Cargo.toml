[workspace]
resolver = "2"
members = [
  "apps/hub-principal/src-tauri",
  "packages/core-sdk/src-rust",
  "modules/mod-optimizer/src-rust",
  "modules/mod-scanner/src-rust",
  "modules/mod-video/src-rust",
  "modules/mod-pdf/src-rust",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Albedo"]
license = "MIT"

[workspace.dependencies]
tauri = { version = "2.2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-dialog = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full", "process", "io-util", "sync", "fs"] }
thiserror = "2.0"
anyhow = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
sysinfo = "0.32"
lopdf = "0.34"

